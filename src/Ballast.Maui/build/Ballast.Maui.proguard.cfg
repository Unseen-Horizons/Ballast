# R8 keep rule shipped with Ballast.Maui (a consumer rule: build/Ballast.Maui.targets adds it to every Android app that uses the package).

# Credential Manager (Google sign-in) finds its Play Services provider by reflection. Google's
# Credential Manager guide requires this rule under R8; without it sign-in fails at runtime
# ("no provider dependencies found") while the build succeeds.
-if class androidx.credentials.CredentialManager
-keep class androidx.credentials.playservices.** {
  *;
}
