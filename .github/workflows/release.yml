name: Release

# Runs when a version tag (v*) is pushed. The build job builds, tests and packs the libraries, and checks that the tag
# matches the package version. The publish job pushes the packages to GitHub Packages (the organisation's NuGet feed)
# and makes the GitHub Release, with every package attached so anyone can download them without signing in. It does
# not start until the owner approves the run in the release environment, so nothing is published without that approval.

on:
  push:
    tags:
      - "v*"

# Read-only by default. Only the publish job asks for a token, and only the one it needs.
permissions:
  contents: read

jobs:
  build:
    name: Build, test, pack and check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Ballast.Maui builds for net10.0-android, which needs the MAUI Android workload. The runner has the Android SDK and Java.
      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore Ballast.slnx

      # Warnings are errors, the same as in ci.yml.
      - name: Build
        run: dotnet build Ballast.slnx --no-restore -warnaserror

      - name: Lint
        run: dotnet format Ballast.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --solution Ballast.slnx --no-restore

      # CI=true (set by GitHub Actions) turns on Source Link and deterministic paths for the packages.
      - name: Pack
        run: dotnet pack Ballast.slnx -c Release --no-restore -o artifacts/packages

      # All packages share one version (Directory.Build.props), so one package's version stands for all of them.
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          actual="$(dotnet msbuild src/Ballast.Errors/Ballast.Errors.csproj -getProperty:PackageVersion)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::The tag $TAG does not match the package version $actual. Nothing was published."
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages/
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages and the GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The owner makes this environment require approval (docs/setup/publishing.md). No step of this job runs until
    # the owner approves the run.
    environment: release
    permissions:
      contents: write # the GitHub Release
      packages: write # GitHub Packages

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The workflow's own token, which lasts for this run only. GitHub Packages takes no symbol packages, so the .snupkg
      # files go only to the Release below. --skip-duplicate: a version already on the feed is skipped and the run still
      # passes, so read the log.
      - name: Push to GitHub Packages
        env:
          FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "packages/*.nupkg" --source "$FEED" --api-key "$TOKEN" --no-symbols --skip-duplicate

      # The packages attached to the Release download without a GitHub sign-in, which the feed always asks for.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" packages/*.nupkg packages/*.snupkg --repo "$GITHUB_REPOSITORY" --verify-tag             --title "$TAG" $prerelease             --notes "The packages of $TAG. What changed is in CHANGELOG.md. The same packages are on the organisation's GitHub Packages feed."
