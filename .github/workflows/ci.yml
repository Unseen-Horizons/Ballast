name: CI

# Every push and every pull request. Packages are built and uploaded
# here. Publishing happens only in release.yml, on a version tag, after the owner approves the run.

on:
  push:
  pull_request:

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build, format, test and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # The SQL-backed tests (job lock, schema, SqlServer, Testing) skip without a server. This service gives them one, so they run
    # here. The password is for this throwaway container only, on the job's own localhost.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "Ci_Ephemeral_Pw123!"
        ports:
          - 1433:1433

    env:
      BALLAST_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=Ci_Ephemeral_Pw123!;TrustServerCertificate=True"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Ballast.Maui builds for net10.0-android, which needs the MAUI Android workload. The runner has the Android SDK and Java.
      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Wait for SQL Server
        uses: ./.github/actions/wait-for-sql
        with:
          password: "Ci_Ephemeral_Pw123!"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Ballast.slnx

      # Warnings are errors: an undocumented public member, a missing file header or an analyzer finding fails here.
      - name: Build
        run: dotnet build Ballast.slnx --no-restore -warnaserror

      - name: Lint
        run: dotnet format Ballast.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --solution Ballast.slnx --no-restore

      # CI=true (set by GitHub Actions) turns on Source Link and deterministic paths for the packages.
      - name: Pack
        run: dotnet pack Ballast.slnx -c Release --no-restore -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages/
          if-no-files-found: error
